<style>
  :root{
    --bg:#ffffff; --page:#faf9f7; --surface:#ffffff; --surface2:#f5f4f0;
    --border:#e7e5df; --border2:#d8d6cf;
    --text:#1a1a1a; --text2:#6b6b67; --muted:#9a9a95;
    --accent:#185fa5; --accentbg:#e6f1fb;
    --green:#1d9e75; --greenbg:#e1f5ee;
    --red:#c0392b; --redbg:#fbeceb;
    --amber:#ba7517; --amberbg:#faeeda;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--page);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.2}
  a{color:var(--accent)}
  svg{display:inline-block;vertical-align:middle}
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;border-bottom:.5px solid var(--border);position:sticky;top:0;background:var(--page);z-index:5}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;line-height:0;flex:none}
  .brand b{font-family:var(--serif);font-size:20px;font-weight:500}
  nav{display:flex;gap:2px;flex-wrap:wrap}
  .tab{padding:7px 13px;border-radius:var(--radius);color:var(--text2);font-size:14px;cursor:pointer;border:none;background:none;font-family:var(--sans)}
  .tab:hover{background:var(--surface2)}
  .tab.active{background:var(--surface2);color:var(--text);font-weight:500}
  .card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:18px 20px}
  .soft{background:var(--surface2);border-radius:var(--radius);padding:16px}
  .grid{display:grid;gap:12px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .stat .lbl{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em}
  .stat .val{font-size:23px;font-weight:500;font-family:var(--serif);margin-top:3px}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .muted{color:var(--text2)}
  label.f{display:block;font-size:13px;color:var(--text2);margin-bottom:5px}
  input,select,textarea,button{font-family:var(--sans);font-size:14px}
  input[type=date],input[type=number],input[type=text],select,textarea{width:100%;height:38px;padding:0 10px;border:.5px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text)}
  select{-webkit-appearance:none;-moz-appearance:none;appearance:none;padding-right:34px;background-color:var(--surface);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b6b67' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:13px}
  textarea{height:auto;padding:8px 10px;min-height:38px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
  .btn{height:38px;padding:0 15px;border-radius:var(--radius);border:.5px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;justify-content:center}
  .btn:hover{background:var(--surface2)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:#14507f}
  .btn.ghost{border:none;padding:0 8px}
  .btn.sm{height:30px;padding:0 8px;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{font-weight:400;color:var(--muted);text-align:left;padding:8px 10px}
  td{padding:9px 10px;border-top:.5px solid var(--border)}
  tr.ok{background:var(--greenbg)} tr.bad{background:var(--redbg)}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px}
  .pill.g{background:var(--greenbg);color:var(--green)} .pill.r{background:var(--redbg);color:var(--red)}
  .dir-v{color:var(--red);font-weight:500} .dir-c{color:var(--green);font-weight:500}
  .prog{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--green)}
  .gitem{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:.5px solid var(--border)}
  .seg{display:inline-flex;border:.5px solid var(--border2);border-radius:var(--radius);overflow:hidden}
  .seg button{height:32px;padding:0 14px;border:none;background:var(--surface);color:var(--text2);cursor:pointer;font-size:13px}
  .seg button.on-si{background:var(--green);color:#fff}
  .seg button.on-no{background:var(--red);color:#fff}
  .verdict{border-radius:12px;padding:18px 20px;text-align:center;margin-top:16px}
  .verdict.go{background:var(--greenbg)} .verdict.stop{background:var(--redbg)} .verdict.wait{background:var(--surface2)}
  .verdict .big{font-family:var(--serif);font-size:26px;font-weight:500}
  .hi{background:var(--accentbg);border-radius:12px;padding:15px 17px;display:flex;gap:11px;color:var(--accent);font-size:14px;line-height:1.55;align-items:flex-start}
  .sec-title{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px}
  .right{text-align:right} .center{text-align:center}
  .mono{font-variant-numeric:tabular-nums}
  .greet{font-size:31px;margin-bottom:3px}
  .greet-sub{font-size:15px;color:var(--text2)}
  .rule-h{font-size:16px;margin:0 0 4px;color:var(--accent)}
  .rule-b{font-size:14px;color:var(--text);line-height:1.6}
  .rule-b b{font-weight:500}
  .cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .cal-m h4{font-size:14px;margin-bottom:7px;text-transform:capitalize}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px}
  .cal-days .h{color:var(--muted);text-align:center;padding:2px 0}

}

function save(){localStorage.setItem(K,JSON.stringify(state));}
const C=()=>state.config;
const $=s=>document.querySelector(s);
const money=n=>(n<0?"−$":"$")+Math.abs(n).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>(n<0?"−$":"$")+Math.abs(Math.round(n)).toLocaleString("es-AR");
const pts=n=>{const v=Math.abs(n).toFixed(2).replace(/\.?0+$/,"");return(n>0?"+":n<0?"−":"")+(v||"0");};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let tab="dash";
const TABS=[["dash","Dashboard"],["log","Bitácora"],["gate","Gate pre-trade"],["reglas","Reglas"],["cal","Calendario"],["cfg","Config"]];
function renderNav(){$("#nav").innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===tab?'active':''}" onclick="go('${k}')">${l}</button>`).join("");}
window.go=k=>{tab=k;render();window.scrollTo(0,0);};

function months(){return [...new Set(state.trades.map(t=>t.date.slice(0,7)))].sort().reverse();}
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESF=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function monthLabel(ym){const[y,m]=ym.split("-");return MES[+m-1]+" "+y;}
let scope=null;
function scopedTrades(){return(!scope||scope==="all")?state.trades:state.trades.filter(t=>t.date.slice(0,7)===scope);}
function stats(list){
  const c=C(),pv=c.pv,ct=c.contracts,cost=c.cost;
  let wins=0,losses=0,be=0,gp=0,lp=0,net=0,dollars=0,rSi=0,rNo=0,rSiP=0,rNoP=0;
  const sorted=[...list].sort((a,b)=>a.date<b.date?-1:1);
  sorted.forEach(t=>{const p=+t.pts||0;net+=p;dollars+=p*pv*ct-cost*ct;
    if(p>0){wins++;gp+=p}else if(p<0){losses++;lp+=p}else be++;
    if(t.regla==="Sí"){rSi++;rSiP+=p}else if(t.regla==="No"){rNo++;rNoP+=p}});
  const n=sorted.length,wr=(wins+losses)?wins/(wins+losses):0,disc=n?rSi/n:0;
  let streak=0;for(let i=sorted.length-1;i>=0;i--){if(sorted[i].regla==="Sí")streak++;else break;}
  return {n,wins,losses,be,gp,lp,net,dollars,rSi,rNo,rSiP,rNoP,wr,disc,streak,sorted};
}
function periodSelect(){
  const opts=[`<option value="all">Todo</option>`].concat(months().map(m=>`<option value="${m}" ${m===scope?"selected":""}>${monthLabel(m)}</option>`)).join("");
  return `<label class="f">Período</label><select style="width:150px" onchange="scope=this.value;render()">${opts}</select>`;
}

function greeting(){const h=new Date().getHours();return h<12?"Buen día":h<20?"Buenas tardes":"Buenas noches";}
function coach(s){
  if(s.n===0)return "Todavía no cargaste operaciones este mes. Cuando aparezca tu manto con la turbo a favor, ahí sí. Paciencia primero.";
  if(s.disc>=0.8)return "Tu disciplina está impecable. Estás operando tu sistema, no tus impulsos. Seguí exactamente así.";
  if(s.disc>=0.5)return "Vas mejorando y se nota. Cada trade en regla te acerca a tu mejor versión. Sostené la turbo como filtro.";
  return "Recordá la lección: cuando seguís tu regla, ganás. Este mes, un solo objetivo — respetar la turbo. Un trade en regla a la vez.";
}
function renderDash(){
  if(!scope)scope=months()[0]||"all";
  const s=stats(scopedTrades()),goal=C().goal/100;
  return `
  <div style="margin-bottom:16px">
    <h1 class="greet">${greeting()}, ${esc(C().name)}</h1>
    <div class="greet-sub">Buen momento para operar con paciencia. Este es tu tablero.</div>
  </div>
  <div class="hi" style="margin-bottom:20px"><span style="color:var(--accent);flex:none">${ic("bulb",20)}</span><div>${coach(s)}</div></div>

  <div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:12px">
    <div><div class="sec-title" style="margin:0">Tu disciplina · ${scope==="all"?"histórico":monthLabel(scope)}</div></div>
    <div>${periodSelect()}</div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="align-items:baseline;justify-content:space-between">
      <div class="row" style="align-items:baseline;gap:12px">
        <div style="font-family:var(--serif);font-size:44px;font-weight:500;line-height:1">${Math.round(s.disc*100)}%</div>
        <div style="max-width:340px"><div style="font-size:14px">trades dentro de tu regla</div>
        <div class="pos" style="font-size:13px">${s.n?(s.disc>=goal?"¡Meta alcanzada! Sostenelo.":"Cada “sí” suma. Vas por buen camino."):"Cargá tu primer trade del mes."}</div></div>
      </div>
      <div class="muted" style="font-size:13px">meta ${C().goal}%</div>
    </div>
    <div class="prog" style="margin-top:14px"><i style="width:${Math.min(100,Math.round(s.disc*100))}%"></i></div>
  </div>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px">
    ${statCard("En regla",pts(s.rSiP)+" pts","pos")}
    ${statCard("Fuera de regla",pts(s.rNoP)+" pts","neg")}
    ${statCard("Win rate",Math.round(s.wr*100)+"%","")}
    ${statCard("Resultado",money(s.dollars),s.dollars>=0?"pos":"neg")}
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px">
    ${statCard("Operaciones",s.n,"")}
    ${statCard("Ganadas / Perdidas",s.wins+" / "+s.losses,"")}
    ${statCard("Break-even",s.be,"")}
    ${statCard("Racha en regla",s.streak,"")}
  </div>

  <div class="card">
    <div class="sec-title">Curva de capital</div>
    ${equitySVG(s.sorted)}
    <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted" style="font-size:12px">Inicio ${money0(C().capital)}</span><span class="muted" style="font-size:12px">Actual ${money0(C().capital+s.dollars)}</span></div>
  </div>`;
}
function statCard(l,v,cls){return `<div class="soft stat"><div class="lbl">${l}</div><div class="val ${cls}">${v}</div></div>`;}
function equitySVG(sorted){
  const cap=C().capital,pv=C().pv,ct=C().contracts,cost=C().cost;let bal=cap;const pt=[bal];
  sorted.forEach(t=>{bal+=(+t.pts||0)*pv*ct-cost*ct;pt.push(bal)});
  if(pt.length<2)return `<div class="muted" style="font-size:13px;padding:20px 0">Cargá operaciones para ver tu curva.</div>`;
  const W=880,H=120,mn=Math.min(...pt),mx=Math.max(...pt),rg=(mx-mn)||1;
  const X=i=>i/(pt.length-1)*W,Y=v=>H-((v-mn)/rg)*(H-14)-7;
  const d=pt.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const base=Y(cap),up=pt[pt.length-1]>=cap;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" preserveAspectRatio="none">
    <line x1="0" y1="${base.toFixed(1)}" x2="${W}" y2="${base.toFixed(1)}" stroke="var(--border2)" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="${d}" fill="none" stroke="${up?'#1d9e75':'#c0392b'}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}

let editId=null;
function renderLog(){
  if(!scope)scope=months()[0]||"all";
  const list=[...scopedTrades()].sort((a,b)=>a.date<b.date?1:-1);
  const rows=list.map(t=>{const p=+t.pts||0,d=p*C().pv*C().contracts-C().cost*C().contracts;
    return `<tr class="${t.regla==='Sí'?'ok':t.regla==='No'?'bad':''}">
      <td class="mono">${t.date.slice(8)}/${t.date.slice(5,7)}</td>
      <td class="${t.dir==='Venta'?'dir-v':'dir-c'}">${t.dir}</td>
      <td class="center">${t.manto||"—"}</td><td>${t.size||"—"}</td><td class="center">${t.turbo||"—"}</td>
      <td class="right mono ${p>0?'pos':p<0?'neg':''}">${pts(p)}</td>
      <td class="right mono ${d>=0?'pos':'neg'}">${money(d)}</td>
      <td class="center">${t.regla==='Sí'?'<span class="pill g">'+ic("check",12)+' regla</span>':t.regla==='No'?'<span class="pill r">'+ic("x",12)+' error</span>':'—'}</td>
      <td class="right" style="white-space:nowrap"><button class="btn ghost sm" title="Editar" onclick="editTrade('${t.id}')">${ic("edit",16)}</button><button class="btn ghost sm" title="Borrar" onclick="delTrade('${t.id}')">${ic("trash",16)}</button></td>
    </tr>`;}).join("");
  return `
  <div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:16px">
    <div><h1 style="font-size:24px">Bitácora</h1><div class="muted" style="font-size:14px;margin-top:2px">Una fila por operación. Sé honesto con la columna de regla — es tu espejo.</div></div>
    <div>${periodSelect()}</div>
  </div>
  ${formHTML()}
  <div class="card" style="padding:6px 0;overflow-x:auto">
    <table><thead><tr><th>Fecha</th><th>Dir.</th><th class="center">Manto</th><th>Tamaño</th><th class="center">Turbo</th><th class="right">Pts</th><th class="right">$</th><th class="center">Regla</th><th></th></tr></thead>
    <tbody>${rows||`<tr><td colspan="9" class="muted center" style="padding:24px">Sin operaciones en este período. Cargá la primera arriba.</td></tr>`}</tbody></table>
  </div>`;
}
function formHTML(){
  const e=editId?state.trades.find(t=>t.id===editId):null;
  const sel=(f,opt,cur)=>opt.map(o=>`<option value="${o}" ${((e?e[f]:"")===o)||(!e&&o===cur)?"selected":""}>${o||"—"}</option>`).join("");
  const today=new Date().toISOString().slice(0,10);
  return `<div class="card" style="margin-bottom:14px">
    <div class="sec-title">${e?"Editar operación":"Nueva operación"}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));align-items:end">
      <div><label class="f">Fecha</label><input type="date" id="f-date" value="${e?e.date:today}"></div>
      <div><label class="f">Dirección</label><select id="f-dir">${sel("dir",["Compra","Venta"],"Venta")}</select></div>
      <div><label class="f">Manto</label><select id="f-manto">${sel("manto",["","1","2","3"],"")}</select></div>
      <div><label class="f">Tamaño</label><select id="f-size">${sel("size",["","Chico","Grande"],"")}</select></div>
      <div><label class="f">Turbo a favor</label><select id="f-turbo" onchange="if(this.value==='No'){document.getElementById('f-regla').value='No'}">${sel("turbo",["","Sí","No"],"")}</select></div>
      <div><label class="f">Resultado (pts)</label><input type="number" step="0.25" id="f-pts" value="${e?e.pts:""}" placeholder="ej. 7 o -7"></div>
      <div><label class="f">¿Seguí la regla?</label><select id="f-regla">${sel("regla",["","Sí","No"],"")}</select></div>
    </div>
    <div style="margin-top:10px"><label class="f">Nota (opcional)</label><textarea id="f-note" placeholder="qué salió bien o qué error cometí">${e?esc(e.note):""}</textarea></div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" onclick="saveTrade()">${e?"Guardar cambios":"Agregar operación"}</button>
      ${e?`<button class="btn" onclick="editId=null;render()">Cancelar</button>`:""}
    </div>
  </div>`;
}
window.saveTrade=()=>{
  const g=id=>document.getElementById(id).value;const date=g("f-date");if(!date){alert("Poné la fecha");return;}
  const rec={date,dir:g("f-dir"),manto:g("f-manto"),size:g("f-size"),turbo:g("f-turbo"),pts:parseFloat(g("f-pts"))||0,regla:g("f-regla"),note:g("f-note").trim()};
  if(editId){Object.assign(state.trades.find(t=>t.id===editId),rec);editId=null;}else{rec.id=crypto.randomUUID();state.trades.push(rec);}
  save();scope=rec.date.slice(0,7);render();
};
window.editTrade=id=>{editId=id;render();window.scrollTo(0,0);};
window.delTrade=id=>{if(confirm("¿Borrar esta operación?")){state.trades=state.trades.filter(t=>t.id!==id);save();render();}};

const GATE=[
  "Hice mi análisis de premercado y marqué zonas",
  "Turbo a favor en 5k Y 20k",
  "La dirección del manto coincide con la turbo",
  "Identifiqué el manto (no es entrada anticipada)",
  "El precio respeta mi zona / confluencia",
  "No es apurada, ni al final de tendencia, ni sobre desgaste",
  "Llevo menos de 2 trades hoy",
  "Definí stop −7 y objetivo en la banda del Keltner",
];
let gateState=GATE.map(()=>null);
function renderGate(){
  const done=gateState.every(v=>v!==null),anyNo=gateState.includes(false);
  let vC="wait",vB="Completá el checklist",vM="Respondé cada punto con sinceridad antes de apretar el botón.";
  if(done&&anyNo){vC="stop";vB="No operar";vM="Falta algo de tu sistema. Saltear este trade también es ganar, "+esc(C().name)+". Esperá el próximo.";}
  else if(done&&!anyNo){vC="go";vB="Operar";vM="Todo a favor. Dale, "+esc(C().name)+" — este es tu trade. Gestioná el stop como sabés.";}
  const items=GATE.map((g,i)=>`<div class="gitem"><div style="font-size:14px;max-width:74%">${g}</div>
    <div class="seg"><button class="${gateState[i]===true?'on-si':''}" onclick="gset(${i},true)">Sí</button><button class="${gateState[i]===false?'on-no':''}" onclick="gset(${i},false)">No</button></div></div>`).join("");
  return `
  <h1 style="font-size:24px;margin-bottom:3px">Gate pre-trade</h1>
  <div class="muted" style="font-size:14px;margin-bottom:16px">Tu filtro antes de entrar. Si algo es “No”, no es tu trade.</div>
  <div class="card">${items}</div>
  <div class="verdict ${vC}"><div class="big ${vC==='go'?'pos':vC==='stop'?'neg':''}">${vB}</div><div style="font-size:14px;margin-top:6px">${vM}</div></div>
  <div class="row" style="margin-top:14px;justify-content:center"><button class="btn" onclick="gateState=GATE.map(()=>null);render()">Reiniciar checklist</button></div>`;
}
window.gset=(i,v)=>{gateState[i]=v;render();};

const REGLAS=[
  ["1 · Contexto / premercado","Antes de operar: revisá la confluencia entre gráficos y marcá tus zonas clave (soporte/resistencia). Tené presente los retrocesos de Fibonacci (ej. 38%). <b>Confiá en las zonas que marcaste</b> — el precio las respeta."],
  ["2 · Dirección — Turbo tendencia (5k y 20k)","EMA9 (blanca) y EMA20 (amarilla) alineadas del mismo lado del precio, en 5k <b>y</b> 20k. EMAs por <b>encima</b> del precio → ventas. Por <b>debajo</b> → compras. Si 5k y 20k no coinciden (no hay turbo) → <b>no se opera</b>."],
  ["3 · Manto (610 · EMA52 + Keltner)","El precio hace la “copa” con la EMA52 en el medio y EMA + Keltner apuntando en el sentido de la tendencia.<br><b>Manto 1:</b> apenas se forma la copa. <b>Manto 2:</b> al romper las 2 EMAs (rápido, por ahora se saltea). <b>Manto 3:</b> al romper las 2 EMAs + pequeño test.<br>Preferí el manto <b>grande</b> (más puntos, requiere paciencia). El chico: no lo descartes por corazonada, medilo."],
  ["4 · Gestión y salida","Stop inicial <b>−7</b> (full). Al primer máximo a favor → stop a <b>−2</b>. En <b>+4</b> → stop a break-even (pivot previo). <b>Objetivo / parcial en la banda externa del Keltner (~6-8 pts)</b> para no devolver a BE lo que ya iba a favor. Mínimo 1:1."],
  ["5 · Riesgo","Máximo <b>2 trades por día</b>. Riesgo <b>7 puntos</b> por trade. Definí tu límite de pérdida diaria."],
  ["6 · No operar (filtros)","Descartá cuando: no hay turbo · contra tendencia · entrada apresurada o anticipada · en soporte/resistencia que reduce probabilidad · lateralización sin confluencia · desgaste ya hecho."],
  ["7 · Errores frecuentes","Apresurado · anticipado · contra turbo · no proteger el stop · operar al final de tendencia · baja probabilidad · desconfiar de una zona con buena info."],
];
function renderReglas(){
  return `<h1 style="font-size:24px;margin-bottom:3px">Reglas del sistema</h1>
  <div class="muted" style="font-size:14px;margin-bottom:18px">Entrada de continuación a favor de tendencia. La turbo es obligatoria: sin turbo, no se opera.</div>
  <div class="grid" style="gap:12px">
    ${REGLAS.map(([h,b])=>`<div class="card"><h3 class="rule-h">${h}</h3><div class="rule-b">${b}</div></div>`).join("")}
  </div>
  <div class="muted" style="font-size:12px;margin-top:14px">Estrategia del profe Sebas, según lo aplicás vos.</div>`;
}

const HOL={
 "2026-01-01":["Año Nuevo","cerr"],"2026-01-19":["Martin Luther King Jr. Day","early"],
 "2026-02-16":["Presidents’ Day","early"],"2026-04-03":["Good Friday","cerr"],
 "2026-05-25":["Memorial Day","early"],"2026-06-19":["Juneteenth","early"],
 "2026-07-03":["Independence Day (obs.)","early"],"2026-09-07":["Labor Day","early"],
 "2026-11-26":["Thanksgiving","early"],"2026-11-27":["Post-Thanksgiving","early"],"2026-12-25":["Navidad","cerr"]
};
function renderCal(){
  const Y=2026;let grid="";
  for(let m=0;m<12;m++){
    const first=(new Date(Y,m,1).getDay()+6)%7, nd=new Date(Y,m+1,0).getDate();
    let cells="";["L","M","X","J","V","S","D"].forEach(h=>cells+=`<div class="h">${h}</div>`);
    for(let i=0;i<first;i++)cells+=`<div></div>`;
    for(let d=1;d<=nd;d++){
      const key=`${Y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const wd=(new Date(Y,m,d).getDay()+6)%7, hol=HOL[key];
      let cls="d",tt="";
      if(hol){cls+=hol[1]==="cerr"?" cerr":" early";tt=` title="${hol[0]} — ${hol[1]==="cerr"?"Cerrado":"Cierre anticipado"}"`;}
      else if(wd>=5)cls+=" wknd";
      cells+=`<div class="${cls}"${tt}>${d}</div>`;
    }
    grid+=`<div class="card cal-m"><h4>${MESF[m]}</h4><div class="cal-days">${cells}</div></div>`;
  }
  const list=Object.entries(HOL).map(([k,v])=>{const dt=new Date(k+"T00:00");const dd=k.slice(8)+"/"+k.slice(5,7);
    const dn=["dom","lun","mar","mié","jue","vie","sáb"][dt.getDay()];
    return `<tr><td class="mono">${dd}</td><td>${dn}</td><td>${v[0]}</td><td><span class="pill ${v[1]==='cerr'?'r':''}" style="${v[1]!=='cerr'?'background:var(--amberbg);color:var(--amber)':''}">${v[1]==='cerr'?'Cerrado':'Cierre anticipado'}</span></td></tr>`;}).join("");
  return `<h1 style="font-size:24px;margin-bottom:3px">Calendario 2026</h1>
  <div class="muted" style="font-size:14px;margin-bottom:14px">Feriados del mercado de EE. UU. (CME / NYSE). Tenelos en cuenta al planificar.</div>
  <div style="margin-bottom:16px"><span class="lg"><span class="dot" style="background:var(--redbg);border:1px solid var(--red)"></span>Cerrado</span><span class="lg"><span class="dot" style="background:var(--amberbg);border:1px solid var(--amber)"></span>Cierre anticipado</span></div>
  <div class="cal-grid" style="margin-bottom:22px">${grid}</div>
  <div class="card" style="padding:6px 0"><table><thead><tr><th>Fecha</th><th>Día</th><th>Feriado</th><th>Estado</th></tr></thead><tbody>${list}</tbody></table></div>`;
}

function renderCfg(){
  const c=C();
  return `
  <h1 style="font-size:24px;margin-bottom:3px">Configuración</h1>
  <div class="muted" style="font-size:14px;margin-bottom:16px">Ajustá instrumento, capital y comisión. Alimenta todos los cálculos.</div>

    <div class="muted" style="font-size:12px;margin-top:10px">NinjaTrader Lifetime: MES ~$0,96 · ES ~$4,28 (ida y vuelta, con fees). MES = $5/pto · ES = $50/pto.</div>
  </div>
  <div class="card">
    <div class="sec-title">Respaldo de datos</div>
    <div style="font-size:14px;margin-bottom:12px">Tus datos se guardan en <b>este navegador</b>. Para usarlos en otra compu: exportá acá e importá del otro lado.</div>
    <div class="row"><button class="btn" onclick="exportData()">${ic("down",16)} Exportar respaldo</button>
    <label class="btn" style="cursor:pointer">${ic("up",16)} Importar respaldo<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label>
    <button class="btn" style="color:var(--red)" onclick="wipe()">${ic("trash",16)} Borrar todo</button></div>

window.instrChange=v=>{document.getElementById("c-pv").value=INSTR[v].pv;document.getElementById("c-cost").value=INSTR[v].cost;};
window.saveCfg=()=>{const g=id=>document.getElementById(id).value;
  Object.assign(state.config,{name:g("c-name")||"Daniel",instrument:g("c-instr"),pv:+g("c-pv")||5,contracts:+g("c-ct")||1,capital:+g("c-cap")||1000,cost:+g("c-cost")||0,goal:+g("c-goal")||80});
  save();const e=document.getElementById("c-ok");e.textContent="Guardado ✓";setTimeout(()=>{if(document.getElementById("c-ok"))document.getElementById("c-ok").textContent="";},1800);
};
window.exportData=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="manto-respaldo-"+new Date().toISOString().slice(0,10)+".json";a.click();};
window.importData=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.config||!Array.isArray(s.trades))throw 0;state=s;save();scope=null;render();alert("Datos importados ✓");}catch(e){alert("Ese archivo no es un respaldo válido de Manto.");}};r.readAsText(f);};
window.wipe=()=>{if(confirm("Esto borra TODAS tus operaciones y config. ¿Seguro?")){localStorage.removeItem(K);state=load();scope=null;render();}};

function render(){
  renderNav();const v=$("#view");
  if(tab==="dash")v.innerHTML=renderDash();
  else if(tab==="log")v.innerHTML=renderLog();
  else if(tab==="gate")v.innerHTML=renderGate();
  else if(tab==="reglas")v.innerHTML=renderReglas();
  else if(tab==="cal")v.innerHTML=renderCal();
  else v.innerHTML=renderCfg();
}
render();
</script>
